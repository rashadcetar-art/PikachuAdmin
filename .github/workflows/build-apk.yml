
name: Build Pikachu Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip *.zip -d source
          find source -name settings.gradle

      - name: Build APK
        run: |
          cd source/PikachuAdminAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PikachuAdmin-APK
          path: source/PikachuAdminAndroid/app/build/outputs/apk/debug/app-debug.apk
